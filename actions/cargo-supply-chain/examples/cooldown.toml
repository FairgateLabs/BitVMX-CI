# Shared age policy for developers and the BitVMX-CI admission checker.
[registry]
global-min-publish-age = "14 days"

# These settings control developers' cargo-cooldown runs only.
# CI always rejects violations and compares lockfiles with the PR base.
[cooldown]
incompatible-publish-age = "deny"
lockfile-baseline = "floor"

# Prefer exact exceptions for reviewed urgent fixes. Review the exception
# together with the dependency update; it takes effect in the same PR.
# [[allow.exact]]
# crate = "example-crate"
# version = "1.2.3"

# Package exceptions affect future versions too; merge them before the update.
# "0" disables the matching package age gate.
# [[allow.package]]
# crate = "example-crate"
# min-publish-age = "1 day"
